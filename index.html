
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globo Terrestre 3D</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#container {
    width: 100vw;
    height: 100vh;
}

/* Painel de informações */
#info {
    position: absolute;
    left: 25px;
    bottom: 25px;
    width: 250px;
    padding: 18px;
    color: white;
    background: rgba(5, 15, 35, 0.78);
    border: 1px solid rgba(100, 180, 255, 0.4);
    border-radius: 12px;
    backdrop-filter: blur(12px);
    display: none;
    z-index: 10;
}

#info h2 {
    font-size: 20px;
    margin-bottom: 8px;
    color: #75caff;
}

#info p {
    font-size: 13px;
    line-height: 1.5;
    color: #ddd;
}

#close {
    position: absolute;
    top: 8px;
    right: 12px;
    cursor: pointer;
    font-size: 20px;
    color: white;
}

#hint {
    position: absolute;
    bottom: 20px;
    right: 20px;
    color: rgba(255,255,255,0.55);
    font-size: 11px;
    letter-spacing: 1px;
    pointer-events: none;
}

#title {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 15px;
    letter-spacing: 5px;
    text-transform: uppercase;
    opacity: 0.75;
    pointer-events: none;
}

@media(max-width: 600px) {
    #info {
        left: 12px;
        bottom: 12px;
        width: 220px;
    }

    #title {
        font-size: 11px;
        letter-spacing: 3px;
    }
}
</style>

</head>

<body>

<div id="container"></div>

<div id="title">SEPS</div>

<div id="info">
    <span id="close">×</span>
    <h2 id="country">País</h2>
    <p id="description">Informações do país.</p>
</div>

<div id="hint">
    ARRASTE PARA GIRAR · SCROLL PARA ZOOM · CLIQUE NOS MARCADORES
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ======================================
// CONFIGURAÇÃO PRINCIPAL
// ======================================

const container = document.getElementById('container');

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 0, 3.6);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 1.0;

container.appendChild(renderer.domElement);

// ======================================
// CONTROLES
// ======================================

const controls = new OrbitControls(camera, renderer.domElement);

controls.enableDamping = true;
controls.dampingFactor = 0.04;

controls.enableZoom = true;
controls.minDistance = 2.2;
controls.maxDistance = 8;

controls.enablePan = false;

controls.autoRotate = false;
controls.autoRotateSpeed = 0.35;

// ======================================
// CARREGAMENTO DAS TEXTURAS
// ======================================

const loader = new THREE.TextureLoader();

const earthTexture = loader.load(
    'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'
);

earthTexture.colorSpace = THREE.SRGBColorSpace;

const cloudTexture = loader.load(
    'https://threejs.org/examples/textures/planets/earth_clouds_1024.png'
);

cloudTexture.colorSpace = THREE.SRGBColorSpace;

const normalTexture = loader.load(
    'https://threejs.org/examples/textures/planets/earth_normal_2048.jpg'
);

const specularTexture = loader.load(
    'https://threejs.org/examples/textures/planets/earth_specular_2048.jpg'
);

// ======================================
// GRUPO DO PLANETA
// ======================================

const earthGroup = new THREE.Group();

scene.add(earthGroup);

// Rotação inicial para destacar as Américas
earthGroup.rotation.y = Math.PI * 0.30;

// ======================================
// ILUMINAÇÃO
// ======================================
// ======================================
// ILUMINAÇÃO REALISTA
// ======================================

// Luz ambiente para iluminar todo o planeta
const ambientLight = new THREE.AmbientLight(
    0xffffff,
    1.0
);

scene.add(ambientLight);

// Luz hemisférica: céu e superfície terrestre
const hemisphereLight = new THREE.HemisphereLight(
    0xd9ecff,
    0x414b42,
    0.65
);

scene.add(hemisphereLight);

// Luz solar principal
const sunLight = new THREE.DirectionalLight(
    0xffffff,
    2.0
);

sunLight.position.set(-4, 2, 5);

scene.add(sunLight);
// ======================================
// SUPERFÍCIE DA TERRA
// ======================================
// ======================================
// SUPERFÍCIE DA TERRA
// ======================================

const earthGeometry = new THREE.SphereGeometry(
    1,
    128,
    128
);

const earthMaterial = new THREE.MeshPhongMaterial({

    map: earthTexture,

    normalMap: normalTexture,

    normalScale: new THREE.Vector2(0.7, 0.7),

    specularMap: specularTexture,

    specular: new THREE.Color(0x333333),

    shininess: 12,

    color: 0xffffff

});

const earth = new THREE.Mesh(
    earthGeometry,
    earthMaterial
);

earthGroup.add(earth);


// ======================================
// NUVENS
// ======================================

const cloudsMaterial = new THREE.MeshPhongMaterial({

    map: cloudTexture,

    transparent: true,

    opacity: 0.72,

    color: 0xffffff,

    shininess: 2,

    specular: new THREE.Color(0x111111),

    depthWrite: false,

    blending: THREE.NormalBlending

});

const clouds = new THREE.Mesh(
    new THREE.SphereGeometry(1.012, 192, 192),
    cloudsMaterial
);

earthGroup.add(clouds);
// ======================================
// ATMOSFERA EXTERNA
// ======================================





// ======================================
// ATMOSFERA TERRESTRE REALISTA
// ======================================

function createAtmosphere(radius, color, intensity, power) {

    const geometry = new THREE.SphereGeometry(
        radius,
        192,
        192
    );

    const material = new THREE.ShaderMaterial({

        uniforms: {
            uColor: {
                value: new THREE.Color(color)
            },

            uIntensity: {
                value: intensity
            },

            uPower: {
                value: power
            }
        },

        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vViewPosition;

            void main() {

                vec4 mvPosition =
                    modelViewMatrix * vec4(position, 1.0);

                vNormal = normalize(
                    normalMatrix * normal
                );

                vViewPosition = -mvPosition.xyz;

                gl_Position =
                    projectionMatrix * mvPosition;
            }
        `,

        fragmentShader: `
            uniform vec3 uColor;
            uniform float uIntensity;
            uniform float uPower;

            varying vec3 vNormal;
            varying vec3 vViewPosition;

            void main() {

                vec3 normal = normalize(vNormal);

                vec3 viewDirection =
                    normalize(vViewPosition);

                float fresnel = 1.0 - max(
                    dot(normal, viewDirection),
                    0.0
                );

                // Transição atmosférica
                float glow = smoothstep(
                    0.08,
                    0.82,
                    fresnel
                );

                // Evita uma linha definida na extremidade
                float fade = 0.2 - smoothstep(
                    0.88,
                    1.0,
                    fresnel
                );

                float alpha =
                    pow(glow, uPower) *
                    fade *
                    uIntensity;

                gl_FragColor = vec4(
                    uColor,
                    alpha
                );
            }
        `,

        transparent: true,

        blending: THREE.AdditiveBlending,

        side: THREE.FrontSide,

        depthWrite: false,

        depthTest: true

    });

    const atmosphere = new THREE.Mesh(
        geometry,
        material
    );

    earthGroup.add(atmosphere);

    return atmosphere;
}


// Camada azul interna
const atmosphereInner = createAtmosphere(
    1.045,
    0x389cff,
    0.95,
    1.5
);


// Camada externa difusa
const atmosphereOuter = createAtmosphere(
    1.105,
    0x367dff,
    0.48,
    1.0
);





// ======================================
// ESTRELAS NO ESPAÇO
// ======================================

const starGeometry = new THREE.BufferGeometry();

const starPositions = [];

for (let i = 0; i < 3500; i++) {

    const x = (Math.random() - 0.5) * 200;
    const y = (Math.random() - 0.5) * 200;
    const z = (Math.random() - 0.5) * 200;

    const distance = Math.sqrt(x*x + y*y + z*z);

    if (distance > 12) {
        starPositions.push(x, y, z);
    }
}

starGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(starPositions, 3)
);

const starMaterial = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.035,
    transparent: true,
    opacity: 0.8
});

const stars = new THREE.Points(
    starGeometry,
    starMaterial
);

scene.add(stars);

// ======================================
// CONVERSÃO DE LATITUDE E LONGITUDE
// ======================================

function latLonToVector3(lat, lon, radius) {

    const phi = (90 - lat) * Math.PI / 180;
    const theta = (lon + 180) * Math.PI / 180;

    const x = -radius * Math.sin(phi) * Math.cos(theta);
    const z = radius * Math.sin(phi) * Math.sin(theta);
    const y = radius * Math.cos(phi);

    return new THREE.Vector3(x, y, z);
}

// ======================================
// MARCADORES DOS PAÍSES
// ======================================

const markers = [];

const markerData = [

    {
        country: 'Brasil',
        city: 'Brasília',
        lat: -15.79,
        lon: -47.88,
        color: 0x00ff88,
        description: 'Brasil — América do Sul. Capital: Brasília. Coordenadas: -15.79°, -47.88°.'
    },

    {
        country: 'Estados Unidos',
        city: 'Nova York',
        lat: 40.71,
        lon: -74.00,
        color: 0xff4444,
        description: 'Estados Unidos — América do Norte. Cidade: Nova York. Coordenadas: 40.71°, -74.00°.'
    },

    {
        country: 'Japão',
        city: 'Tóquio',
        lat: 35.67,
        lon: 139.65,
        color: 0xffcc44,
        description: 'Japão — Ásia. Capital: Tóquio. Coordenadas: 35.67°, 139.65°.'
    },

    {
        country: 'França',
        city: 'Paris',
        lat: 48.85,
        lon: 2.35,
        color: 0x4488ff,
        description: 'França — Europa. Capital: Paris. Coordenadas: 48.85°, 2.35°.'
    },

    {
        country: 'Austrália',
        city: 'Sydney',
        lat: -33.86,
        lon: 151.20,
        color: 0xff55dd,
        description: 'Austrália — Oceania. Cidade: Sydney. Coordenadas: -33.86°, 151.20°.'
    },

    {
        country: 'Egito',
        city: 'Cairo',
        lat: 30.04,
        lon: 31.23,
        color: 0xff9933,
        description: 'Egito — África. Capital: Cairo. Coordenadas: 30.04°, 31.23°.'
    }

];

// ======================================
// CRIAÇÃO VISUAL DOS MARCADORES
// ======================================

markerData.forEach((data) => {

    const position = latLonToVector3(
        data.lat,
        data.lon,
        1.025
    );

    const markerGroup = new THREE.Group();

    markerGroup.position.copy(position);

    // Orienta o marcador perpendicularmente à superfície
    markerGroup.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 0, 1),
        position.clone().normalize()
    );

    // Esfera central
    const sphereGeometry = new THREE.SphereGeometry(
        0.026,
        24,
        24
    );

    const sphereMaterial = new THREE.MeshBasicMaterial({
        color: data.color
    });

    const sphere = new THREE.Mesh(
        sphereGeometry,
        sphereMaterial
    );

    sphere.userData = data;

    markerGroup.add(sphere);

    // Anel luminoso
    const ringGeometry = new THREE.RingGeometry(
        0.032,
        0.038,
        40
    );

    const ringMaterial = new THREE.MeshBasicMaterial({
        color: data.color,
        transparent: true,
        opacity: 0.85,
        side: THREE.DoubleSide
    });

    const ring = new THREE.Mesh(
        ringGeometry,
        ringMaterial
    );

    ring.position.z = 0.002;

    markerGroup.add(ring);

    // Círculo externo pulsante
    const pulseGeometry = new THREE.RingGeometry(
        0.04,
        0.045,
        40
    );

    const pulseMaterial = new THREE.MeshBasicMaterial({
        color: data.color,
        transparent: true,
        opacity: 0.65,
        side: THREE.DoubleSide
    });

    const pulse = new THREE.Mesh(
        pulseGeometry,
        pulseMaterial
    );

    pulse.position.z = 0.001;

    markerGroup.add(pulse);

    markerGroup.userData.pulse = pulse;
    markerGroup.userData.sphere = sphere;
    markerGroup.userData.data = data;

    earthGroup.add(markerGroup);

    markers.push(markerGroup);

});

// ======================================
// INTERAÇÃO COM OS MARCADORES
// ======================================

const raycaster = new THREE.Raycaster();

const mouse = new THREE.Vector2();

let pointerDown = null;

renderer.domElement.addEventListener(
    'pointerdown',
    (event) => {
        pointerDown = {
            x: event.clientX,
            y: event.clientY
        };
    }
);

renderer.domElement.addEventListener(
    'pointerup',
    (event) => {

        if (!pointerDown) return;

        const movement = Math.hypot(
            event.clientX - pointerDown.x,
            event.clientY - pointerDown.y
        );

        pointerDown = null;

        // Evita interpretar um arraste como clique
        if (movement > 5) return;

        mouse.x =
            (event.clientX / window.innerWidth) * 2 - 1;

        mouse.y =
            -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        const clickableMarkers = markers.map(
            marker => marker.userData.sphere
        );

        const intersects = raycaster.intersectObjects(
            clickableMarkers
        );

        if (intersects.length > 0) {

            const data = intersects[0].object.userData;

            document.getElementById('country').textContent =
                data.country;

            document.getElementById('description').textContent =
                data.description;

            document.getElementById('info').style.display =
                'block';

            // Suspende a rotação automática
            controls.autoRotate = false;
        }

    }
);


// FECHAR PAINEL


document.getElementById('close').addEventListener(
    'click',
    () => {

        document.getElementById('info').style.display =
            'none';

    }
);


// ANIMAÇÃO

// Use caso queira que a terra gire auto


const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const elapsed = clock.getElapsedTime();

    // Movimento independente das nuvens
    clouds.rotation.y += 0.00012;

    // Animação dos marcadores
    markers.forEach((marker, index) => {

        const pulse = marker.userData.pulse;

        const scale = 1 + Math.sin(
            elapsed * 2.5 + index
        ) * 0.30;

        pulse.scale.set(scale, scale, scale);

        pulse.material.opacity =
            0.35 + (Math.sin(elapsed * 2.5 + index) + 1) * 0.20;

    });

    // Atualiza controles
    controls.update();

    renderer.render(scene, camera);
}

animate();


// RESPONSIVIDADE


window.addEventListener('resize', () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

});

</script>

</body>
</html>
